name: Lint

on:
  push:
    branches:
      - "**"
      - "!main"

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-24.04 # ubuntu-26.04 has no Ruby build for our .ruby-version patch

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare application environment
        uses: ./.github/actions/prepare-app-env

      - name: Run Prettier
        run: yarn prettier --check --ignore-unknown --log-level warn '**/*'

  rubocop:
    name: Rubocop
    runs-on: ubuntu-24.04 # ubuntu-26.04 has no Ruby build for our .ruby-version patch

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare application environment
        uses: ./.github/actions/prepare-app-env

      - name: Run Rubocop
        run: bin/bundle exec rubocop
